<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuel Receipt (Thermal Style) - Developed by Dilip Kumar TD</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial,sans-serif;background:#eef1f5;margin:0;color:#111}
  .wrap{max-width:900px;margin:16px auto;padding:0 12px;display:grid;grid-template-columns:310px 1fr;gap:16px}
  @media(max-width:760px){.wrap{grid-template-columns:1fr}}
  .panel{background:#fff;border-radius:8px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  label{display:block;font-size:12px;color:#444;margin:8px 0 3px}
  input,select,textarea{width:100%;padding:7px;border:1px solid #bbb;border-radius:4px;font-size:14px}
  .row{display:flex;gap:8px}.row>div{flex:1}
  button{margin-top:10px;width:100%;padding:10px;border:0;border-radius:4px;background:#0b5394;color:#fff;font-size:14px}
  button.s{background:#555}
  #gpsMsg{font-size:12px;color:#555;margin-top:6px}
  .tabs{display:flex;gap:6px;margin-bottom:8px}.tab{margin-top:0;background:#ccd;color:#222}.tab.on{background:#0b5394;color:#fff}
  .side{position:absolute;top:0;bottom:0;width:22px;writing-mode:vertical-rl;text-align:center;font-weight:bold;font-size:12px;letter-spacing:2px;overflow:hidden;white-space:nowrap;display:flex;align-items:center;justify-content:center}
  .side.imgside{transform:none!important;writing-mode:horizontal-tb;display:block}
  .side.l{transform:rotate(180deg)}
  .side.comb{display:flex;align-items:center;writing-mode:horizontal-tb;transform:none!important}
  .cell{display:flex;width:100%;flex:none}
  .side.comb .stxt{line-height:1;writing-mode:vertical-rl;white-space:nowrap;font-weight:bold;letter-spacing:2px;padding:4px 0;flex:none}
  .side.l.comb .stxt{transform:rotate(180deg)}
  .stxt.box{background:var(--ink,#555);color:#fff}
  .side.box{background:var(--ink,#555);color:#fff;top:12px;bottom:12px}
  .receipt{position:relative;text-transform:uppercase;background:#fff;width:80mm;max-width:100%;margin:0 auto;padding:12px;
    font-family:"Courier New",monospace;font-size:13px;color:var(--ink,#1a2a9c);align-self:start;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .c{text-align:center}
  .name{font-size:18px;font-weight:bold}
  .ln{white-space:pre}
  .kv{display:flex;white-space:nowrap}.kv span:first-child{min-width:17ch;flex:none}
  .dash{border-top:1px dashed var(--ink,#1a2a9c);margin:6px 0}
  @media print{
    body{background:#fff}.panel{display:none}.wrap{display:block;margin:0}
    .receipt{box-shadow:none;width:80mm;margin:0}
  }
</style>
</head>
<body>
<!-- Software developed by Dilip Kumar TD -->
<div class="wrap">
 <div class="panel">
  <div class="tabs">
    <button id="tabR" class="tab on" onclick="showTab('R')">Receipt</button>
    <button id="tabS" class="tab" onclick="showTab('S')">Settings (one time)</button>
  </div>

  <!-- ================= RECEIPT PAGE (every bill) ================= -->
  <div id="pageR">
  <div class="row">
    <div><label>Date</label><input id="dt" type="date"></div>
    <div><label>Time</label><input id="tm" type="time" step="1"></div>
  </div>
  <button class="s" onclick="setNow()">Use current date &amp; time</button>
  <div class="row">
    <div><label>Receipt ID</label><input id="rid"></div>
    <div><label>Trx ID</label><input id="trx"></div>
  </div>
  <button class="s" onclick="newReceipt()">New receipt (next number)</button>
  <div class="row">
    <div><label>Pump</label><input id="pump" value="1"></div>
    <div><label>Nozzle</label><input id="noz" value="1"></div>
  </div>
  <div class="row">
    <div><label>Copy type</label><select id="copy"><option>ORIGINAL</option><option>DUPLICATE</option><option>CUSTOMER COPY</option><option>OFFICE COPY</option></select></div>
    <div><label>Payment</label><select id="mop"><option>CASH</option><option>CARD</option><option>UPI</option></select></div>
  </div>
  <label>Payment reference - UPI ref / card last 4 (optional)</label><input id="payref">
  <label>Product</label>
  <select id="prod"><option>PETROL</option><option>DIESEL</option><option>POWER PETROL</option><option>POWER DIESEL</option><option>CNG</option></select>

  <button onclick="getLoc()">Get my location &amp; rate</button>
  <div id="gpsMsg"></div>
  <label>Rate per litre/kg (₹)</label><input id="rate" type="number" step="0.01" value="100.00">

  <label style="display:none">Fill by</label>
  <select id="by" style="display:none"><option value="amt">Amount (₹)</option><option value="qty">Quantity (L)</option></select>
  <div class="row">
    <div><label>Amount (₹)</label><input id="amt" type="number" step="0.01" value="1000"></div>
    <div><label>Quantity (litres / kg)</label><input id="qty" type="number" step="0.001" value=""></div>
  </div>
  <label>Customer name</label><input id="cust">
  <label>Mobile number</label><input id="mob" type="tel">
  <label>Vehicle number</label><input id="veh" placeholder="e.g. DL01AB1234">
  <label>Vehicle type</label>
  <select id="vtype"><option value="">-</option><option>Car</option><option>Bike</option><option>Scooter</option><option>Auto</option><option>Truck</option><option>Bus</option><option>Tractor</option><option>Other</option></select>
  <button onclick="render()">Generate receipt</button>
  <button class="s" onclick="window.print()">Print</button>
  <button onclick="saveReceipt()">Save receipt to database</button>
  <div id="dbMsg" style="font-size:12px;color:#555;margin-top:6px"></div>
  <details style="margin-top:10px" open><summary style="font-size:13px"><b>Saved receipts</b></summary>
    <div id="hist" style="font-size:12px;max-height:200px;overflow:auto"></div>
    <button class="s" onclick="exportCsv()">Export CSV</button>
  </details>
  </div>

  <!-- ================= SETTINGS PAGE (set once, saved) ================= -->
  <div id="pageS" style="display:none">
  <b>Station</b>
  <label>Your company logo (optional)</label><input id="logo" type="file" accept="image/*">
  <label>Station name</label><input id="st" value="My Fuel Station">
  <label>Address (one line per row)</label><textarea id="ad" rows="3">Main Road
City - 000000</textarea>
  <label>Tax ID / Tel (optional)</label><input id="tin">
  <div class="row">
    <div><label>CST no.</label><input id="cst"></div>
    <div><label>LST no.</label><input id="lst"></div>
    <div><label>VAT no.</label><input id="vatn"></div>
  </div>
  <label>Operator / attendant (optional)</label><input id="oper">
  <div class="row">
    <div><label>VAT/GST % included (0 = hide)</label><input id="vat" type="number" step="0.01" value="0"></div>
  </div>
  <label>Footer message (one line per row)</label>
  <textarea id="ft" rows="4">Thanks &amp; Visit Again
Save Fuel, Save Money
Thanks for fuelling with us.
You can now call us on 303600 (toll free) for queries/complaints</textarea>

  <b style="display:block;margin-top:14px">Print style</b>
  <div class="row">
    <div><label>Date format</label><select id="dfmt"><option value="dmy">DD/MM/YYYY</option><option value="dmy2">DD-MM-YYYY</option><option value="dmon">DD MON YYYY</option><option value="ymd">YYYY-MM-DD</option><option value="mdy">MM/DD/YYYY</option></select></div>
    <div><label>Print colour</label><select id="ink"><option value="blue">Blue ink</option><option value="bw">Black &amp; white</option></select></div>
    <div><label>Paper width</label><select id="width"><option value="80mm">80 mm</option><option value="58mm">58 mm</option></select></div>
  </div>
  <div class="row">
    <div><label>Font size (px)</label><input id="fs" type="number" min="8" max="30" value="13"></div>
    <div><label>Station name size</label><input id="nfs" type="number" min="10" max="40" value="18"></div>
    <div><label>Side text size</label><input id="sfs" type="number" min="8" max="30" value="12"></div>
  </div>

  <b style="display:block;margin-top:14px">Paper roll side print</b>
  <label>Side image - left (optional)</label><input id="imgLf" type="file" accept="image/*">
  <label>Side image - right (optional)</label><input id="imgRf" type="file" accept="image/*">
  <div class="row">
    <div><label>Rotate side images</label><select id="imgRot"><option value="270">270° (reads upward)</option><option value="90">90° (reads downward)</option><option value="0">None</option></select></div>
    <div><button class="s" style="margin-top:22px" onclick="clearImgs()">Remove images</button></div>
  </div>
  <div class="row">
    <div><label>Side image width (px)</label><input id="iw" type="number" min="10" max="120" value="30"></div>
    <div><label>Image scale (%)</label><input id="isz" type="number" min="10" max="300" value="100"></div>
  </div>
  <div class="row">
    <div><label>Distance from paper edge (px)</label><input id="sEdge" type="number" min="0" max="60" value="2"></div>
    <div><label>Gap image-text on same line (px)</label><input id="sGap" type="number" min="0" max="60" value="6"></div>
    <div><label>Gap to receipt text (px)</label><input id="sBody" type="number" min="0" max="60" value="6"></div>
  </div>
  <label>Image &amp; text alignment across strip</label>
  <select id="sHal"><option value="center">Center</option><option value="start">Left</option><option value="end">Right</option></select>
  <label>Side print alignment along roll</label>
  <select id="sPos"><option value="center">Center</option><option value="top">Top</option><option value="bottom">Bottom</option></select>
  <label>Side text - left (optional)</label><input id="sideL" placeholder="e.g. {date} - use {date} {time} {rid}">
  <label>Side text - right (optional)</label><input id="sideR" placeholder="e.g. {date} {time}">
  <div class="row">
    <div><label>Side text style</label><select id="sideS"><option value="box">Dark box</option><option value="plain">Plain</option></select></div>
    <div><label>Repeat down the roll</label><select id="sideRep"><option value="0">No</option><option value="1">Yes</option></select></div>
  </div>

  <b style="display:block;margin-top:14px">Fuel rate source</b>
  <label>City rate table (City=petrol,diesel)</label>
  <textarea id="tbl" rows="6" style="font-size:12px">Delhi=102.12,95.20
Mumbai=111.21,97.83
Bengaluru=111.68,99.56
Chennai=107.77,99.55
Kolkata=113.51,99.82
Hyderabad=115.69,103.82</textarea>
  <label>Live price API URL (use {city}) — optional</label>
  <input id="apiUrl" placeholder="https://your-fuel-api.example/prices?city={city}">
  <label>API key (sent as Bearer token) — optional</label>
  <input id="apiKey">
  <div style="font-size:11px;color:#555">Fill the table from the oil companies' published prices; saved in this browser.</div>

  <b style="display:block;margin-top:14px">Backup</b>
  <button class="s" onclick="exportSettings()">Backup settings (JSON)</button>
  <label>Restore settings from backup</label><input id="impf" type="file" accept=".json,application/json">
  <button class="s" onclick="clearAll()">Delete all saved data</button>
  <div style="font-size:11px;color:#555;margin-top:6px">All settings on this page save automatically.</div>
  </div>

  <div style="margin-top:12px;font-size:11px;color:#666;text-align:center">Software developed by Dilip Kumar TD</div>
 </div>

 <div class="receipt" id="r"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
function setNow(){
  const d=new Date();
  $('dt').value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  $('tm').value=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  $('rid').value=''+d.getTime();
  $('trx').value=String(d.getTime()).slice(-6);
}
function rates(){
  const o={};
  $('tbl').value.split('\n').forEach(l=>{
    const [c,v]=l.split('=');if(!c||!v)return;
    const [p,d]=v.split(',');o[c.trim().toLowerCase()]={p:parseFloat(p),d:parseFloat(d)};
  });return o;
}
function applyRate(city){
  const r=rates()[(city||'').toLowerCase()];
  if(r){const v=/diesel/i.test($('prod').value)?r.d:r.p;if(v){$('rate').value=v.toFixed(2);calc('rate');return true}}
  return false;
}
function findPrice(o,key){
  if(o&&typeof o==='object'){
    for(const k in o){
      if(k.toLowerCase().includes(key)){
        const v=parseFloat(typeof o[k]==='object'&&o[k]?(o[k].price??o[k].rate??Object.values(o[k])[0]):o[k]);
        if(v>0)return v;
      }
    }
    for(const k in o){const r=findPrice(o[k],key);if(r)return r}
  }
  return null;
}
async function tryApi(city){
  const u=$('apiUrl').value.trim();if(!u)return null;
  try{
    const h={};if($('apiKey').value.trim())h.Authorization='Bearer '+$('apiKey').value.trim();
    const j=await (await fetch(u.replace('{city}',encodeURIComponent(city)),{headers:h})).json();
    const v=findPrice(j,/diesel/i.test($('prod').value)?'diesel':'petrol');
    if(v){$('rate').value=v.toFixed(2);calc('rate');return v}
  }catch(e){}
  return null;
}
function getLoc(){
  const m=$('gpsMsg');
  if(!navigator.geolocation){m.textContent='Location not supported.';return}
  m.textContent='Getting location…';
  navigator.geolocation.getCurrentPosition(async p=>{
    try{
      const j=await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${p.coords.latitude}&lon=${p.coords.longitude}`)).json();
      const a=j.address||{};
      const city=a.city||a.town||a.state_district||a.state||'';
      const live=await tryApi(city);
      if(live)$('gpsMsg').textContent=`Location: ${city}. Live rate ₹${live.toFixed(2)} fetched.`;
      else if(applyRate(city))$('gpsMsg').textContent=`Location: ${city}. Live fetch unavailable; used table rate (check it is current).`;
      else $('gpsMsg').textContent=`Location: ${city}. No live or table rate — enter the rate manually.`;
    }catch(e){m.textContent='Could not look up place name. Enter rate manually.'}
  },e=>m.textContent='Location denied/unavailable. Enter rate manually.');
}
function render(){
  const rate=parseFloat($('rate').value)||0;
  let amt=parseFloat($('amt').value)||0, qty=parseFloat($('qty').value)||0;
  if($('by').value==='amt'){qty=rate?amt/rate:0}else{amt=qty*rate}
  const [y,mo,d]=($('dt').value||'').split('-');
  const rows=[
    ['RCPT ID',$('rid').value],['DATE',fmtDate()],['TIME',$('tm').value],
    ['TRX. ID',$('trx').value],['MOP NAME',$('mop').value],['PUMP',$('pump').value],
    ['NOZZLE',$('noz').value],...($('oper').value?[['OPERATOR',$('oper').value]]:[]),...($('payref').value?[['PAY REF',$('payref').value]]:[]),['PRODUCT',$('prod').value],
    ['VOLUME ('+(/CNG/.test($('prod').value)?'KG':'L')+')',qty.toFixed(3)],['RATE (RS/'+(/CNG/.test($('prod').value)?'KG':'L')+')',rate.toFixed(2)],['AMOUNT (RS)',amt.toFixed(2)]];
  const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const imgW=parseFloat($('iw').value)||30;const imgS=parseFloat($('isz').value)||100;
  const num=(id,d)=>{const v=parseFloat($(id).value);return isNaN(v)?d:v};
  const E=num('sEdge',2),G1=num('sGap',6),G2=num('sBody',6),TW=(parseFloat($('sfs').value)||12)+10;
  /* each edge = ONE strip; image then text follow each other along the same line */
  const strips=(t,c,img)=>{
    const pos=c==='l'?'left':'right';
    const t0=t.trim()?sub(t.trim()):'';
    if(!img&&!t0)return {html:'',used:0};
    const iw=imgW*imgS/100;
    const W=Math.max(img?iw:0,t0?TW:0);
    const jh={start:'flex-start',center:'center',end:'flex-end'}[$('sHal').value]||'center';
    const unit=(img?`<div class="cell" style="justify-content:${jh}"><img src="${img}" style="width:${iw}px;display:block;flex:none"></div>`:'')+
      (t0?`<div class="cell" style="justify-content:${jh}"><span class="stxt ${$('sideS').value==='box'?'box':''}">${esc(t0)}</span></div>`:'');
    const rep=$('sideRep').value==='1';
    const vp=$('sPos').value,left=c==='l';
    const jc=vp==='center'?'center':((vp==='top')===!left?'flex-start':'flex-end');
    const body=rep?Array(30).fill(unit).join(''):unit;
    const html=`<div class="side ${c} comb" style="${pos}:${E}px;width:${W}px;gap:${G1}px;flex-direction:${c==='l'?'column-reverse':'column'};justify-content:${jc};align-items:stretch">${body}</div>`;
    return {html,used:E+W};
  };
  const SL=strips($('sideL').value,'l',imgL),SR=strips($('sideR').value,'r',imgR);
  const sides=SL.html+SR.html;
  const padL=SL.used?Math.round(SL.used+G2):12,padR=SR.used?Math.round(SR.used+G2):12;
  const vatp=parseFloat($('vat').value)||0;
  let extra='';
  if(vatp>0){const tax=amt-amt/(1+vatp/100);extra+=`<div class="kv"><span>TAX INCL @${vatp}% (RS)</span><span>: ${tax.toFixed(2)}</span></div>`}
  let h=logoData?`<div class="c"><img src="${logoData}" style="max-width:60%;max-height:90px"></div>`:'';
  h+=`<div class="c name">${esc($('st').value)}</div>`;
  $('ad').value.split('\n').forEach(l=>h+=`<div class="c">${esc(l)}</div>`);
  if($('tin').value)h+=`<div class="c">${esc($('tin').value)}</div>`;
  [['cst','CST NO'],['lst','LST NO'],['vatn','VAT NO']].forEach(([k,l])=>{if($(k).value.trim())h+=`<div class="c">${l}: ${esc($(k).value.trim())}</div>`});
  h+=`<div class="c">-------- ${esc($('copy').value)} --------</div><div class="dash"></div>`;
  rows.forEach(r=>h+=`<div class="kv"><span>${r[0]}</span><span>: ${esc(r[1])}</span></div>`);
  h+=`<div class="dash"></div>
    <div class="kv"><span>TOTAL SALE (RS)</span><span>: ${amt.toFixed(2)}</span></div>
    ${extra}
    <div class="kv"><span>CUSTOMER</span><span>: ${esc($('cust').value||'-')}</span></div>
    <div class="kv"><span>MOBILE NO</span><span>: ${esc($('mob').value||'-')}</span></div>
    <div class="kv"><span>VEHICLE NO</span><span>: ${esc($('veh').value||'-')}</span></div>
    <div class="kv"><span>VEHICLE TYPE</span><span>: ${esc($('vtype').value||'-')}</span></div>
    <div class="dash"></div>`;
  $('ft').value.split('\n').forEach(l=>h+=`<div class="c">${esc(sub(l))}</div>`);
  $('r').innerHTML=sides+h;
  const bw=$('ink').value==='bw';
  $('r').style.setProperty('--ink',bw?'#000':'#1a2a9c');
  $('r').querySelectorAll('img,.imgside').forEach(e=>e.style.filter=bw?'grayscale(1) contrast(1.4)':'');$('r').style.width=$('width').value;
  $('r').style.padding=`12px ${padR}px 12px ${padL}px`;
  $('r').style.fontSize=(parseFloat($('fs').value)||13)+'px';
  const nm=$('r').querySelector('.name');if(nm)nm.style.fontSize=(parseFloat($('nfs').value)||18)+'px';
  $('r').querySelectorAll('.stxt').forEach(e=>{e.style.fontSize=(parseFloat($('sfs').value)||12)+'px';e.style.width=TW+'px';e.style.textAlign='center'});
}
let logoData='',imgLraw='',imgRraw='',imgL='',imgR='';
function rot(d,deg){
  if(!d||!deg)return Promise.resolve(d);
  return new Promise(res=>{const i=new Image();
    i.onload=()=>{const c=document.createElement('canvas');c.width=i.height;c.height=i.width;
      const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(deg*Math.PI/180);x.drawImage(i,-i.width/2,-i.height/2);res(c.toDataURL('image/png'))};
    i.onerror=()=>res(d);i.src=d});
}
async function refreshImgs(){const g=+$('imgRot').value;imgL=await rot(imgLraw,g);imgR=await rot(imgRraw,g);render()}
function readImg(inp,cb){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{cb(rd.result);await refreshImgs();saveProfile()};rd.readAsDataURL(f)}
$('imgLf').addEventListener('change',e=>readImg(e.target,v=>imgLraw=v));
$('imgRf').addEventListener('change',e=>readImg(e.target,v=>imgRraw=v));
$('imgRot').addEventListener('change',()=>{refreshImgs();saveProfile()});
function clearImgs(){imgLraw=imgRraw=imgL=imgR='';$('imgLf').value='';$('imgRf').value='';render();saveProfile()}
$('logo').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{logoData=rd.result;render();saveProfile()};rd.readAsDataURL(f);
});
const _o=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],_t=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
function _2(n){return n<20?_o[n]:_t[Math.floor(n/10)]+(n%10?" "+_o[n%10]:"")}
function inWords(n){
  if(n===0)return"Zero";let o="";
  const c=Math.floor(n/1e7);n%=1e7;const l=Math.floor(n/1e5);n%=1e5;const t=Math.floor(n/1e3);n%=1e3;const h=Math.floor(n/100);n%=100;
  if(c)o+=_2(c)+" Crore ";if(l)o+=_2(l)+" Lakh ";if(t)o+=_2(t)+" Thousand ";if(h)o+=_o[h]+" Hundred ";if(n)o+=_2(n);
  return o.trim();
}
function fmtDate(){
  const [y,m,d]=($('dt').value||'').split('-');if(!y)return '';
  const mon=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][+m-1];
  switch($('dfmt').value){
    case 'dmy2':return `${d}-${m}-${y}`;
    case 'dmon':return `${d} ${mon} ${y}`;
    case 'ymd':return `${y}-${m}-${d}`;
    case 'mdy':return `${m}/${d}/${y}`;
    default:return `${d}/${m}/${y}`;
  }
}
/* {date} {time} {datetime} {rid} {trx} inside side text / footer */
function sub(t){
  return t.replace(/\{date\}/gi,fmtDate()).replace(/\{time\}/gi,$('tm').value||'')
    .replace(/\{datetime\}/gi,(fmtDate()+' '+($('tm').value||'')).trim())
    .replace(/\{rid\}/gi,$('rid').value||'').replace(/\{trx\}/gi,$('trx').value||'');
}
function newReceipt(){
  let n=1;try{n=(parseInt(localStorage.getItem('seq'))||0)+1;localStorage.setItem('seq',n)}catch(e){}
  setNow();$('trx').value=String(n).padStart(6,'0');
  $('qty').value='';$('amt').value='';render();
}
/* ---- Live calculation: Amount = Litres x Rate ---- */
function calc(src){
  const rate=parseFloat($('rate').value)||0;
  if(src==='qty')$('by').value='qty';
  if(src==='amt')$('by').value='amt';
  if($('by').value==='qty'){
    const q=parseFloat($('qty').value)||0;
    $('amt').value=(Math.round(q*rate*100)/100).toFixed(2);
  }else{
    const a=parseFloat($('amt').value)||0;
    $('qty').value=rate?(a/rate).toFixed(3):'';
  }
  render();
}
$('qty').addEventListener('input',()=>calc('qty'));
$('amt').addEventListener('input',()=>calc('amt'));
$('rate').addEventListener('input',()=>calc('rate'));
$('prod').addEventListener('change',()=>calc('rate'));

function showTab(t){
  $('pageR').style.display=t==='R'?'':'none';$('pageS').style.display=t==='S'?'':'none';
  $('tabR').classList.toggle('on',t==='R');$('tabS').classList.toggle('on',t==='S');
}
/* ---- IndexedDB (stored in this browser on this device) ---- */
const DB=new Promise((res,rej)=>{
  const r=indexedDB.open('fuelreceipt',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('rcpt',{keyPath:'id',autoIncrement:true})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
});
function tx(store,mode,fn){
  return DB.then(d=>new Promise((res,rej)=>{
    const t=d.transaction(store,mode);const q=fn(t.objectStore(store));
    t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);
  }));
}
const PF=['st','ad','tin','sPos','sHal','sEdge','sGap','sBody','dfmt','ink','cst','lst','vatn','ft','rate','tbl','apiUrl','apiKey','iw','isz','imgRot','fs','nfs','sfs','sideL','sideR','sideS','sideRep','copy','width','oper','vat','pump','noz','mop','prod','cust','mob','veh','vtype'];
function saveProfile(){
  const p={logoData,imgLraw,imgRraw};PF.forEach(k=>p[k]=$(k).value);
  tx('kv','readwrite',s=>s.put(p,'profile')).catch(()=>{});
}
async function loadProfile(){
  try{
    const p=await tx('kv','readonly',s=>s.get('profile'));
    if(p){PF.forEach(k=>{if(p[k]!==undefined)$(k).value=p[k]});logoData=p.logoData||'';imgLraw=p.imgLraw||'';imgRraw=p.imgRraw||'';await refreshImgs()}
  }catch(e){}
}
const ALL=['st','ad','tin','sPos','sHal','sEdge','sGap','sBody','dfmt','ink','cst','lst','vatn','ft','iw','isz','fs','nfs','sfs','sideL','sideR','sideS','sideRep','copy','width','oper','payref','vat','dt','tm','rid','trx','pump','noz','mop','prod','rate','by','amt','qty','cust','mob','veh','vtype'];
async function saveReceipt(){
  render();
  const rec={saved:Date.now()};ALL.forEach(k=>rec[k]=$(k).value);
  try{await tx('rcpt','readwrite',s=>s.add(rec));$('dbMsg').textContent='Saved.';saveProfile();loadHist()}
  catch(e){$('dbMsg').textContent='Could not save (browser storage blocked?).'}
}
async function loadHist(){
  let all=[];try{all=await tx('rcpt','readonly',s=>s.getAll())||[]}catch(e){}
  all.reverse();
  $('hist').innerHTML=all.length?'':'No saved receipts yet.';
  all.forEach(r=>{
    const d=document.createElement('div');
    d.style.cssText='padding:4px 0;border-bottom:1px solid #eee;display:flex;gap:6px;justify-content:space-between';
    const a=document.createElement('a');a.href='#';
    a.textContent=`${r.dt} ${r.tm} · ${r.prod} · ₹${r.amt||''} · #${r.rid}`;
    a.onclick=e=>{e.preventDefault();ALL.forEach(k=>$(k).value=r[k]);render()};
    const x=document.createElement('a');x.href='#';x.textContent='✕';
    x.onclick=async e=>{e.preventDefault();await tx('rcpt','readwrite',s=>s.delete(r.id));loadHist()};
    d.append(a,x);$('hist').append(d);
  });
}
async function exportCsv(){
  const all=await tx('rcpt','readonly',s=>s.getAll())||[];
  const cols=['id',...ALL];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv=[cols.join(','),...all.map(r=>cols.map(c=>q(r[c])).join(','))].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='fuel_receipts.csv';a.click();
}
function exportSettings(){
  const p={logoData,imgLraw,imgRraw};PF.forEach(k=>p[k]=$(k).value);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(p)],{type:'application/json'}));
  a.download='fuel_receipt_settings.json';a.click();
}
$('impf').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=async()=>{try{
    const p=JSON.parse(rd.result);
    PF.forEach(k=>{if(p[k]!==undefined)$(k).value=p[k]});
    logoData=p.logoData||'';imgLraw=p.imgLraw||'';imgRraw=p.imgRraw||'';
    await refreshImgs();calc('rate');saveProfile();$('dbMsg').textContent='Settings restored.';
  }catch(err){$('dbMsg').textContent='Invalid settings file.'}};
  rd.readAsText(f);
});
async function clearAll(){
  if(!confirm('Delete saved logo, details and all saved receipts from this browser?'))return;
  await tx('kv','readwrite',s=>s.clear());await tx('rcpt','readwrite',s=>s.clear());
  logoData='';loadHist();render();
}
PF.forEach(k=>$(k).addEventListener('input',saveProfile));
['dt','tm','rid','trx'].forEach(k=>$(k).addEventListener('input',render));
['copy','ink','dfmt','sPos','sHal','sEdge','sGap','sBody','width','oper','payref','vat','cst','lst','vatn','iw','isz','fs','nfs','sfs','sideL','sideR','sideS','sideRep'].forEach(k=>$(k).addEventListener('input',render));
(async()=>{try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}setNow();await loadProfile();calc('amt');loadHist()})();
['tbl','apiUrl','apiKey'].forEach(id=>{
  try{const t=localStorage.getItem(id);if(t)$(id).value=t}catch(e){}
  $(id).addEventListener('input',()=>{try{localStorage.setItem(id,$(id).value)}catch(e){}});
});
